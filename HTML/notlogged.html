<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lemoniq | Access Denied</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }

        .video-bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -5; }
        #rainCanvas { position: fixed; inset: 0; z-index: -4; pointer-events: none; }
        .outer-blur { position: fixed; inset: 0; backdrop-filter: blur(8px) brightness(0.6); z-index: -1; }

        .site-frame {
            position: relative;
            width: calc(100vw - 80px);
            height: calc(100vh - 80px);
            background: rgba(0, 0, 0, 0.3);
            border-radius: 40px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        .top-nav {
            height: 75px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 45px;
            background: rgba(255, 255, 255, 0.12);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 11;
        }

        .logo-brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #fff;
            text-decoration: none;
        }

        .nav-item {
            margin-left: 25px;
            color: #fff;
            text-decoration: none;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.5;
            transition: 0.3s;
        }

        .nav-item:hover { opacity: 1; }

        .main-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .glass-box {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 50px;
            max-width: 450px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .error-icon {
            font-size: 40px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        h1 {
            font-size: 32px;
            font-weight: 200;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .message {
            font-size: 13px;
            line-height: 1.6;
            font-weight: 300;
            color: rgba(255,255,255,0.6);
            margin-bottom: 30px;
        }

        .btn-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            text-decoration: none;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-primary { background: #fff; color: #000; }
        .btn-primary:hover { background: #eee; transform: translateY(-1px); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .fade-in { animation: fadeIn 1.2s ease forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<video class="video-bg" autoplay muted loop playsinline>
    <source src="../images/bg2.mp4" type="video/mp4">
</video>

<canvas id="rainCanvas"></canvas>
<div class="outer-blur"></div>

<div class="site-frame">
    <nav class="top-nav">
        <a href="/" class="logo-brand">lemoniq</a>
        <div class="nav-links">
            <a href="/" class="nav-item">Home</a>
            <a href="/articles" class="nav-item">Articles</a>
        </div>
    </nav>

    <main class="main-container">
        <div class="glass-box fade-in">
            <div class="error-icon">✦</div>
            <h1>Access Restricted</h1>
            <p class="message">You are not logged in. Please sign in to your account to view this page or create new stories.</p>

            <div class="btn-row">
                <a href="/" class="btn btn-secondary">Return Home</a>
            </div>
        </div>
    </main>
</div>

<script>
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles;

    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * width * 1.5 - (width * 0.5),
                y: Math.random() * height,
                l: Math.random() * 15 + 5,
                v: Math.random() * 12 + 8,
                a: 0.2
            });
        }
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;

        particles.forEach(p => {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.l * Math.sin(p.a), p.y + p.l * Math.cos(p.a));
            ctx.stroke();

            p.x += p.v * Math.sin(p.a);
            p.y += p.v * Math.cos(p.a);

            if (p.y > height) {
                p.y = -20;
                p.x = Math.random() * width * 1.5 - (width * 0.5);
            }
        });

        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', init);
    init();
    draw();
</script>

</body>
</html>
