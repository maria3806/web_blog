<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles | lemoniq</title>
    <link rel="stylesheet" href="/css/articles.style.css">
    <style>
        .article-image{
            width:100%;
            height:250px;
            display:block;
            object-fit:cover;
            border-radius:20px;
            margin-top:15px;
            border:1px solid rgba(255,255,255,0.1);
        }

        .glass-card{
            transition:transform .3s ease, box-shadow .3s ease;
        }

        .glass-card:hover{
            transform:translateY(-4px);
            box-shadow:0 12px 30px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>

<video class="video-bg" autoplay muted loop playsinline>
    <source src="/images/bg2.mp4" type="video/mp4">
</video>
<canvas id="rainCanvas"></canvas>
<div class="outer-blur"></div>

<div class="site-frame">
    <svg class="border-svg">
        <rect x="0" y="0" width="100%" height="100%" rx="40" ry="40" class="line-path"></rect>
    </svg>

    <nav class="top-nav">
        <a href="/" class="logo-brand">lemoniq</a>
        <div class="nav-links">
            <a href="/faq" class="nav-item">FAQ</a>
            <a href="/articles" class="nav-item active">Articles</a>
            <a href="/account" class="nav-item">My Account</a>
            <a href="/about" class="nav-item">About Us</a>
            <a href="/dashboard-access" class="nav-item">Dashboard</a>
        </div>
    </nav>

    <main class="content-scroll">
        <header class="page-header fade-in">
            <h1>articles</h1>
        </header>

        <section class="articles-list">
            {{range .Articles}}
            <article class="glass-card fade-in">
                <div class="card-content">
                    <span class="tag">{{.Author}}</span>
                    <h3>{{.Title}}</h3>
                    <p>{{.Content}}</p>

                    {{if .Image}}
                    <img class="article-image" src="{{.Image}}" alt="{{.Title}}">
                    {{end}}

                    <p style="margin-top:12px; opacity:0.6; font-size:12px;">
                        Published: {{.Published}}
                    </p>
                </div>
            </article>
            {{end}}

            <a href="/new" class="glass-card add-card fade-in">
                <div class="plus-icon">+</div>
            </a>
        </section>
    </main>
</div>

<script>
    const canvas = document.getElementById('rainCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles;

    function init() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * width * 1.5 - (width * 0.5),
                y: Math.random() * height,
                l: Math.random() * 15 + 5,
                v: Math.random() * 12 + 8,
                a: 0.2
            });
        }
    }

    function draw() {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.lineWidth = 1;

        particles.forEach(p => {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + p.l * Math.sin(p.a), p.y + p.l * Math.cos(p.a));
            ctx.stroke();

            p.x += p.v * Math.sin(p.a);
            p.y += p.v * Math.cos(p.a);

            if (p.y > height) {
                p.y = -20;
                p.x = Math.random() * width * 1.5 - (width * 0.5);
            }
        });

        requestAnimationFrame(draw);
    }

    window.addEventListener('resize', init);
    init();
    draw();
</script>

</body>
</html>
